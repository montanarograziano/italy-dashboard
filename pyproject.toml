[project]
name = "italy-dashboard"
version = "0.1.0"
description = "Internal dashboard for Italian statistics (ISTAT): crime, population, labor, economy"
requires-python = ">=3.11"
dependencies = [
    "reflex==0.9.8",
    "duckdb>=1.5,<2",
    "polars>=1.40,<2",
    "httpx2>=2.9,<3",
    "pyyaml>=6,<7",
    "pydantic>=2,<3",
    "dbt-duckdb>=1.9,<2",
]

[project.optional-dependencies]
# Bulk ERA5-Land backfill via Copernicus CDS (ingestion/cds.py). Not part of
# the core install: only someone doing a bulk temperature backfill needs a
# CDS account, an accepted licence, and these packages. Install with:
#   uv sync --extra cds
cds = [
    "cdsapi>=0.7,<1",
    "xarray>=2024.1,<2026",
    "netcdf4>=1.6,<2",
]

# Browser rendering tests (tests/browser/): assertions on computed styles a
# real browser paints, which no Reflex render-TREE test can see (recharts
# resolves several props, like an axis tick's `fill`, in ways the Python-side
# component tree cannot reflect). Only someone running that suite needs a
# Chromium download. Install with:
#   uv sync --extra browser
#   uv run playwright install chromium
browser = [
    "pytest-playwright>=0.5,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.13",
    "pyrefly>=0.30",
    "marimo>=0.11",
    "altair>=5.4",
    "pyarrow>=18",
    "zensical>=0.0.53",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "italy_dashboard"]

# ------------------------------------------------------------------ ruff

[tool.ruff]
line-length = 100
target-version = "py311"
# Plan and spec docs hold code FRAGMENTS, not modules: formatting them wraps
# isolated snippets in tuple parens, so an implementer pasting a fence gets a
# tuple literal instead of the call argument the step meant.
exclude = [
    # Plan and spec docs hold code FRAGMENTS, not modules: formatting them wraps
    # isolated snippets in tuple parens, so an implementer pasting a fence gets a
    # tuple literal instead of the call argument the step meant.
    "docs/superpowers/**",
    # Git-ignored agent scratch: reports and ledgers, never shipped code.
    ".superpowers/**",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by the formatter where it matters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Reflex state vars are declared as class attributes with defaults by design.
"italy_dashboard/state.py" = ["RUF012"]
# marimo cells end with a bare expression on purpose: that's the cell output.
"notebooks/*" = ["B018"]

# --------------------------------------------------------------- pyrefly

[tool.pyrefly]
project-includes = ["ingestion", "italy_dashboard", "scripts", "tests"]
project-excludes = ["**/.venv", "**/.web", "**/node_modules"]
# tests/unit/test_palette_artifacts.py imports generate_palette by inserting
# scripts/ onto sys.path at runtime (it is a script, not a package); mirror
# that here so pyrefly resolves the same import statically.
search-path = ["scripts"]

[tool.pyrefly.errors]
# Reflex's descriptor-based state fields (reflex.Field.__get__/__set__) trip
# this check inside the framework's own typing; not actionable in our code.
bad-class-definition = false

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end pipeline tests (still offline)",
    "live: tests that hit the real ISTAT API (deselected by default)",
    "browser: browser-rendering tests against a real Chromium (needs the `browser` extra + `playwright install chromium`, deselected by default)",
]
addopts = "-m 'not live and not browser'"
