# yaml-language-server: $schema=https://raw.githubusercontent.com/dbt-labs/dbt-jsonschema/main/schemas/latest/dbt_project-latest.json
name: italy_dashboard
version: "1.0.0"
profile: italy_dashboard

# Run from the repo root:  just transform
# (all relative paths below resolve against the repo root cwd)

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  italy_dashboard:
    staging:
      +materialized: view
    marts:
      # Marts land as Parquet files the dashboard picks up directly
      # (italy_dashboard/queries.py builds views from data/marts/*.parquet).
      +materialized: external

seed-paths: ["seeds"]

seeds:
  italy_dashboard:
    +quote_columns: false
    province_capitals:
      +column_types:
        province_code: varchar
        province_name: varchar
        capital_city: varchar
        region_code: varchar
        region_name: varchar
        lat: double
        lon: double
        elevation_m: double
        cell_elevation_m: double
    violent_crime_codes:
      +column_types:
        crime_code: varchar
        crime_name: varchar
