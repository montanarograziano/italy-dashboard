# yaml-language-server: $schema=https://raw.githubusercontent.com/dbt-labs/dbt-jsonschema/main/schemas/latest/dbt_yml_files-latest.json
version: 2

sources:
  - name: raw
    description: Raw SDMX-CSV files downloaded by `just refresh` (ingestion/fetch.py).
    tables:
      - name: crime_raw
        description: >
          ISTAT dataflow 73_58 — felonies of persons convicted by final
          judgement. Combined "CODE: Label" headers and cell values.
          NOTE: no citizenship dimension exists in this dataflow; crimes by
          citizenship need a separate ISTAT dataflow (pending discovery).
        meta:
          external_location: >-
            read_csv_auto('{{ env_var('ITALY_DATA_DIR', 'data') }}/raw/crime_reported.csv',
                          header=true, all_varchar=true)
      - name: offenders_raw
        description: >
          ISTAT dataflow 73_230_DF_DCCV_AUTVITTPS_7 — alleged offenders
          reported/arrested by the police, by province/region, type of crime,
          sex, age, and citizenship (Italian vs foreign).
        meta:
          external_location: >-
            read_csv_auto('{{ env_var('ITALY_DATA_DIR', 'data') }}/raw/crime_offenders.csv',
                          header=true, all_varchar=true)
  - name: snapshots
    description: Normalized parquet snapshots written by ingestion/fetch.py.
    tables:
      - name: population_resident_pq
        description: Resident population by region and year (sex/age totals).
        meta:
          external_location: >-
            read_parquet('{{ env_var('ITALY_DATA_DIR', 'data') }}/population_resident.parquet')
      - name: population_foreign_pq
        description: Foreign residents by region and year (sex/age totals).
        meta:
          external_location: >-
            read_parquet('{{ env_var('ITALY_DATA_DIR', 'data') }}/population_foreign.parquet')
      - name: income_regional_pq
        description: >
          Household gross disposable income (B6G, S14) by region and year,
          millions of euro; category = publication EDITION (stg_income keeps
          only the latest edition per region-year).
        meta:
          external_location: >-
            read_parquet('{{ env_var('ITALY_DATA_DIR', 'data') }}/income_regional.parquet')
      - name: weather_daily_pq
        description: >
          Daily min/mean/max 2 m temperature per province capital city from
          Open-Meteo's ERA5-Land archive (1950+). Reanalysis, not station
          observations: right for trends and anomalies, wrong for record extremes.
        meta:
          external_location: >-
            read_parquet('{{ env_var('ITALY_DATA_DIR', 'data') }}/weather_daily.parquet')
      - name: labor_naspi_beneficiaries_pq
        description: >
          NASPI unemployment-benefit recipients by NUTS2 region and sex
          (INPS dataflow DFB_ST_NASPI_BENEFICIARI_02, fetched through the
          StatKit hub middleware, not SDMX-REST — see
          ingestion/inps_client.py). No embedded labels in the raw CSV
          (unlike ISTAT's labels=both); stg_naspi joins region names from
          the province_capitals seed and decodes sex inline.
        meta:
          external_location: >-
            read_parquet('{{ env_var('ITALY_DATA_DIR', 'data') }}/labor_naspi_beneficiaries.parquet')
      - name: education_university_scholarships_pq
        description: >
          USTAT/MUR DSU university scholarship interventions by region,
          intervention type, and academic year. The normalized snapshot keeps
          the main count column from the CKAN CSV; mart_dsu exposes the
          granted-scholarship category for the dashboard.
        meta:
          external_location: >-
            read_parquet('{{ env_var('ITALY_DATA_DIR', 'data') }}/education_university_scholarships.parquet')
