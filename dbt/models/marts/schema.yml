# yaml-language-server: $schema=https://raw.githubusercontent.com/dbt-labs/dbt-jsonschema/main/schemas/latest/dbt_yml_files-latest.json
version: 2

models:
  - name: mart_crime
    description: >
      Headline crime series (dataflow 73_58, convictions by final judgement)
      by year, region, offence type, sex, and age at time of crime.
      Consumed by the dashboard from data/marts/mart_crime.parquet.
    columns:
      - name: year
        tests: [not_null]
      - name: region_code
        tests: [not_null]
      - name: offence_code
        tests: [not_null]
      - name: value
        tests: [not_null]

  - name: mart_offenders
    description: >
      Alleged offenders reported by the police (73_230 family) by year, region,
      indicator, type of crime, sex, age, and citizenship.
      Consumed from data/marts/mart_offenders.parquet.
    columns:
      - name: year
        tests: [not_null]
      - name: region_code
        tests: [not_null]
      - name: citizenship_code
        tests: [not_null]
      - name: value
        tests: [not_null]

  - name: mart_population
    description: Resident, foreign, and italian population by region and year.
    columns:
      - name: year
        tests: [not_null]
      - name: region_code
        tests: [not_null]

  - name: mart_naspi
    description: >
      NASPI unemployment-benefit recipients by NUTS2 region, sex, and year
      (INPS, via the hub middleware, not ISTAT SDMX-REST). Keeps the raw
      territory/category/period/value column names (not region_code/year)
      on purpose: this lets queries.naspi_series reuse _region_filter and
      region_names unchanged, the same generic helpers labor_unemployment
      already uses, instead of the renamed schema the other dbt marts use.
      Consumed from data/marts/mart_naspi.parquet.
    columns:
      - name: territory
        tests: [not_null]
      - name: category
        tests: [not_null]
      - name: period
        tests: [not_null]
      - name: value
        tests: [not_null]

  - name: mart_offender_rates
    description: >
      Alleged offenders per 1,000 residents of the same citizenship group, by
      year, region, and type of crime. Rates are NULL where population
      denominators are missing (foreign residents data starts in 2019).
    columns:
      - name: year
        tests: [not_null]
      - name: citizenship_code
        tests: [not_null]
      - name: offenders
        tests: [not_null]

  - name: mart_crime_income
    description: >
      Offender rate per 1,000 by citizenship joined with regional household
      disposable income (B6G totals, millions EUR; per capita = total income
      / total resident population) — the basis for the ecological
      income/crime correlation view. income_per_capita is NULL until both
      the income and population datasets are fetched.
    columns:
      - name: year
        tests: [not_null]
      - name: region_code
        tests: [not_null]
      - name: citizenship_code
        tests: [not_null]

  - name: mart_climate_annual
    description: Annual temperature per province capital, with CLINO anomalies.
    columns:
      - name: province_code
        tests: [not_null]
      - name: year
        tests: [not_null]
      - name: t_mean
        tests: [not_null]

  - name: mart_climate_monthly
    description: Monthly temperature per province capital, with CLINO anomalies.
    columns:
      - name: province_code
        tests: [not_null]
      - name: year
        tests: [not_null]
      - name: month
        tests: [not_null]

  - name: mart_crime_climate
    description: >
      Region x year panel of summer temperature anomaly against violent
      offender counts, with two-way demeaned columns. Ecological, annual,
      underpowered — association only.
    columns:
      - name: region_code
        tests: [not_null]
      - name: year
        tests: [not_null]
      - name: ln_offenders
        tests: [not_null]

  - name: mart_climate_region
    description: >
      Region-level annual climate, unweighted mean of member capitals, with
      CLINO anomalies. Includes one national 'IT' / 'Italia' row per year,
      the unweighted mean across all province capitals.
    columns:
      - name: region_code
        tests: [not_null]
      - name: year
        tests: [not_null]
