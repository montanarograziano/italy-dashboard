# Deploys the static (TypeScript/DuckDB-WASM) frontend under web/. This is a
# SEPARATE site from the Reflex app Render hosts (see docs/12-deployment.md):
# no backend, no websocket, just static files plus data queried client-side.
[build]
  # scripts/stage_web_data.py is invoked directly here (not only via
  # web/package.json's predev/prebuild hooks) so this command is
  # self-sufficient and readable on its own. It is called with plain `python3`,
  # not `uv run`: Netlify's build image does not include `uv` (checked against
  # netlify/build-image's included_software.md and the current
  # "Available software at build time" docs -- neither lists it, only Python
  # itself, pip and Pipenv), and the script has zero third-party dependencies
  # (stdlib only: re, shutil, pathlib), so it needs no environment beyond
  # Python itself.
  command = "python3 scripts/stage_web_data.py && npm --prefix web ci && npm --prefix web run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

# No Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy headers here,
# DELIBERATELY: duckdb.getJsDelivrBundles() (web/src/db.ts) only ever returns
# an `mvp` and an `eh` bundle -- it never includes a `coi` (cross-origin-
# isolated, threaded) entry at all (confirmed by reading
# @duckdb/duckdb-wasm's dist/duckdb-browser.mjs and dist/types/src/platform.d.ts).
# selectBundle() only reaches for `coi` when the bundle SET it was given
# contains one; since jsDelivr's set never does, COOP/COEP would have zero
# effect on which bundle this app loads -- it always resolves to `eh`
# (exception-handling, single-threaded) in any browser with WebAssembly
# exception support, which is every current major browser. Adding COEP
# speculatively would only add risk: `require-corp` blocks cross-origin
# subresources unless they opt in, and this page's DuckDB wasm/workers load
# from jsDelivr, a cross-origin CDN.
